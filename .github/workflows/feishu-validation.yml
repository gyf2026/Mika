name: Feishu windows v0.1.36 validation
on:
  push:
    branches: [codex/validate-feishu]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :core:cliTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feishu-core-test-results
          path: core/build/reports/tests/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug -PdevInstall --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feishu-android-test-results
          path: app/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: Mika-Dev-Feishu-Windows-v0.1.36
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
